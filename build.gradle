plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'dev.yuzhe.aeaffinity'
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation "maven.modrinth:ae2:${ae2_version}"
    runtimeOnly 'maven.modrinth:guideme:21.1.10'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.mockito:mockito-core:5.15.2'
}

neoForge {
    version = neoforge_version

    runs {
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'aeaffinity'
        }
    }

    mods {
        aeaffinity {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.aeaffinity
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar) {
    exclude 'dev/yuzhe/aeaffinity/gametest/**'
    exclude 'data/aeaffinity/structure/empty.nbt'
}

tasks.register('verifyAll') {
    group = 'verification'
    description = 'Runs unit tests, builds the distributable JAR, and executes headless AE2 GameTests.'
    dependsOn tasks.named('build'), tasks.named('runGameTestServer')
}

test {
    useJUnitPlatform()
}

def expandedModVersion = providers.gradleProperty('mod_version').get()

processResources {
    inputs.property 'version', expandedModVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: expandedModVersion
    }
}
